services:
  app:
    build:
      context: .
    ports:
      - "8080:80" # host 8080 -> container 80
    volumes:
      - .:/var/www/html
    environment:
      # Postgres yang jalan di komputer Anda (yang dibuka lewat pgAdmin).
      # Bisa ditimpa lewat file .env tanpa mengubah file ini.
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-iconnet}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway" # dibutuhkan di Linux, aman di Windows/Mac
